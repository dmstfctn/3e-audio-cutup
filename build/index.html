<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big things coming (human in the loop)</title>
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/times-new-roman-mt-condensed-opentype-1_ufonts.com.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/times-new-roman-mt-bold-condensed-opentype-1_ufonts.com.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style/style.css?v=19">
<link rel="stylesheet" href="style/minigames.css?v=19">
</head>
<body>

<div id="ui-header" hidden>
  <button id="play"></button>
  <div id="toggles"></div>
  <button id="submit" hidden>submit your lines</button>
</div>

<div id="screen">
  <div id="screen-text"></div>
  <button id="screen-go" disabled>loading…</button>
</div>

<div id="game" hidden>
  <div id="status"></div>
  <div id="now-word"></div>
  <div id="lines"></div>
  <div id="more-lines"><div id="active" hidden><span id="active-boxes"></span></div><button id="fewer" title="remove the last line, and its words">−</button><button id="more" title="add a line">+</button></div>
  <div id="palette"></div>
</div>

<div id="minigame" hidden>
  <div id="mg-body">
    <div id="mg-card">
      <p id="mg-text"></p>
      <div id="mg-buttons"><button id="mg-retry">retry</button><button id="mg-go"></button></div>
    </div>
  </div>
</div>
<div id="mg-backdrop"></div>

<div id="strip" hidden></div>

<div id="show" hidden>
  <div id="show-lines"></div>
  <div id="show-buttons"><button id="show-back">back to writing</button><button id="show-submit">submit your lines*</button></div>
  <div id="show-text"></div>
</div>

<script src="javascript/lib/js-yaml.min.js"></script>
<script src="javascript/minigames.js?v=19"></script>
<script src="javascript/main.js?v=19"></script>
</body>
</html>
