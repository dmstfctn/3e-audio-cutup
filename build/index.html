<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutup</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style/style.css">
<link rel="stylesheet" href="style/minigames.css">
</head>
<body>

<div id="ui-header" hidden>
  <button id="play"></button>
  <div id="toggles"></div>
  <button id="submit" hidden>submit ↑</button>
  <div id="points" class="point"></div>
</div>

<div id="screen">
  <div id="screen-text"></div>
  <button id="screen-go" disabled>loading…</button>
</div>

<div id="game" hidden>
  <div id="status"></div>
  <div id="lines"></div>
  <button id="more">+</button>
  <div id="palette"></div>
</div>

<div id="minigame" hidden>
  <div id="mg-body">
    <div id="mg-card">
      <p id="mg-text"></p>
      <div id="mg-buttons"><button id="mg-retry">retry</button><button id="mg-go"></button></div>
    </div>
  </div>
</div>

<div id="strip" hidden></div>

<div id="show" hidden>
  <div id="show-lines"></div>
  <div id="show-buttons"><button id="show-back">back to writing</button><button id="show-restart">restart</button></div>
</div>

<script src="javascript/lib/js-yaml.min.js"></script>
<script src="javascript/minigames.js"></script>
<script src="javascript/main.js"></script>
</body>
</html>
