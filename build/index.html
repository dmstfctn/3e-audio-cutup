<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cutup</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style/style.css">
<link rel="stylesheet" href="style/minigames.css">
</head>
<body>

<div id="tracks" hidden></div>

<div id="screen" class="dark">
  <div id="screen-text"></div>
  <button id="screen-go" disabled>loading…</button>
</div>

<div id="game" hidden>
  <div id="transport">
    <span id="status"></span>
    <button id="submit" hidden>submit</button>
  </div>
  <div id="lines"></div>
  <div id="palette"></div>
  <div id="footer"><button id="restart">restart</button></div>
</div>

<div id="notice" hidden>
  <div>
    <p id="notice-text"></p>
    <button id="notice-go"></button>
  </div>
</div>

<div id="minigame" hidden>
  <div id="mg-top"><b id="mg-title"></b><span id="mg-task"></span></div>
  <div id="mg-body">
    <div id="mg-card">
      <p id="mg-text"></p>
      <div id="mg-buttons"><button id="mg-retry">retry</button><button id="mg-go"></button></div>
    </div>
  </div>
</div>

<div id="strip" hidden></div>

<div id="show" hidden>
  <div id="show-lines"></div>
  <button id="show-back" hidden>back to writing</button>
</div>

<script src="javascript/lib/js-yaml.min.js"></script>
<script src="javascript/minigames.js"></script>
<script src="javascript/main.js"></script>
</body>
</html>
