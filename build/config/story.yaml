# The story: the order the game runs in, its screens of text, the first
# line and its words, and the words given for writing at the end.
#
# - sequence is the game from start to end, a step at a time:
#     page: light or dark, with text: a screen of text (see below)
#     try: a game (pair-it, find, find-all or caption-match), played with no
#          timer until the first win, then on to the next step. It wins nothing.
#          A game with several plays (find, find-all) only plays its first.
#          prompt: sets its prompt, in place of games.yaml's.
#     games: [the games in order], each played through once, with its timer.
#          Words won fly to the strip at the bottom. After each game, its
#          points, with retry and next task; last-button is the button after
#          the last game.
#     write: the end: the lines, the tray and the tracks.
#   Any step can have play: [tracks], unlock: [tracks] and stop: [tracks],
#   track names from games.yaml. A track played is unlocked from then on and
#   comes on; one unlocked is there to switch on when writing, off; stop
#   switches it off, and the player can still switch it back on. The track
#   toggles only show when writing.
#   write: is the end on its own, or write: with unlock: etc. under it.
# - A page's text shows a line at a time. A line ends with its button in
#   [square brackets], which shows the next line; the last line's button moves
#   on to the next step. Lines without a button show along with the next line
#   that has one. A button on a line of its own shows with no new text. Blank
#   lines show as a gap.
# - A row that's ![](story/hand.jpg) is an image, from build/images/, up to 40%
#   of the screen high. It comes in with the rows around it, and can have a
#   [button] after it like any row.
# - A page that's one image, up to 60% of the screen high:
#     - page: dark
#       image: story/hand.jpg
#       button: next      # optional; with none, clicking the image moves on
#   A page's images load a step or two before it.
# - Words are grouped by bin (noun, verb…). Words match as in bins.yaml, and
#   apostrophes are ignored (that’s = thats). A word shows in the bin bins.yaml
#   gives it. Listing it under another bin still offers it, with a warning
#   above the lines. A word that isn't in the recording is left out, with a
#   warning.
# - The tray shows every recording of each word, so a word said 20 times shows
#   20 times.
# - Reload the page to see edits. Texts apply straight away. The first line and
#   its words apply from the next new game (restart). Changing the sequence can
#   start a new game.

# the button for a page's last line if it has none
next: next

sequence:
  - page: dark
    text: Big things coming (human in the loop) [start]
  - page: light
    text: |
     ​



      you’re finally awake [next]
      when can you start? [log on]
  - try: pair-it
    prompt: pair two
  - page: light
    text: |
      you’re a data labeller by day [next]
      you check the rules [next]
  #- page: light
  #  image: story/work.png
#    button: next # or remove this to click image to move on
  #- page: light
   # text: you check the rules [next]
  - page: light
    text: |
      1. rawdownload images 
      2. solve puzzles 
      3. learn new words [next]
  #- try: pair-it
  #- page: light
  #  text: |
  #    you check the rules [next]
  #    1. rawdownload images 
  #    2. solve puzzles 
  #    3. unlock words [next]
  - page: light
    text: |     
      you rawdownload the lot and start training
      [start]
  - games: [pair-it, find, caption-match, find-all]
    last-button: finish training
    play: [metro]
  - page: light
    text: |
      ​


      
      you log off [next]
      training complete [next]
      you are a data labeller by day [next]
    stop: [metro]
  - page: dark
    text: |
     ​
      and a rapper by night [next]
      you trained to speak the tangible, the real [next]
      but you want to turn it around and make it poetic [next]
  - page: dark
    text: |
      wapping power station 7pm next sunday [next]
      you've got a slot but no lines [next]
      what's on your mind? [start writing]
  - write:
    #unlock: [drone]
    play: [beat]

# After submit your lines: the text under the lines and their buttons. A blank line starts a new paragraph.
# [text](https://…) is a link, opening in a new tab; with no address, just the
# text.
submitted: |
  Big things coming (2026) tells the story of Degular, a data-labeller by day and rapper by night. Trained to describe the world through objective, manageable language, Degular struggles when rapping with this same language.

  * On Sunday 18 October, a version of the story will screen at [Wapping Power Station](https://www.somersethouse.org.uk/whats-on/3-evenings-sunday), featuring Degular performing the lines submitted here, voiced and recorded by rapper Jawnino.
  
  The same version will stream on [3ETV](https://www.somersethouse.org.uk/channel/commissions/3etv) until December 16.

# The lines at the end start empty. The tray has every recording of line's
# words and of these.
first:
  line: 
  words:
    noun: 
    verb: [ ]
    pronoun: [ ]
    glue: [ ]

# Writing: the lines, the first line's words, what the games won, and these,
# every recording of each.
write:
  pauses: [0.25, 0.5, 1, 2, 4]   # beats: 1 = a quarter note, 4 = a bar
  yeahs: all                     # every yeah; or a list of them
  words:
    noun: [ ]
    adjective: [ ]
    verb: [do, is, are, was, what's, tell ]
    pronoun: [I, it, my, nothing, them, this, what, its]
    glue: [a, an, and, also, at, but, by, down, for, if, just, no, not, of, on, out, that, the, to, with, there, thats]
