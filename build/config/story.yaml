# The story: the screens of text between stages, the first stage's line and
# words, and the words given for writing at the end.
#
# - Screens (intro, brief, debrief) are lists, shown one after another. Each has
#   a text and a button. The text shows a line at a time, with the `next`
#   button below; after its last line, the screen's own button. Blank lines
#   show as a gap and don't take a click.
# - Words are grouped by bin (noun, verb…). Words match as in bins.yaml, and
#   apostrophes are ignored (that’s = thats). A word shows in the bin bins.yaml
#   gives it. Listing it under another bin still offers it, with a warning
#   above the lines. A word that isn't in the recording is left out, with a
#   warning.
# - The tray shows every recording of each word, so a word said 20 times shows
#   20 times. Point at one to hear it.
# - Reload the page to see edits. Texts apply straight away. The first line and
#   the first words apply from the next new game (restart).

# the button that shows a screen's next line
next: next

# before the first stage
intro:
  - text: |
      you’re a rapper by night
      george tavern 10pm next thursday
      you've got a slot but just one line
    button: check your line

# The first stage: 2 lines, silent, with the first one filled in (always with
# the first recording of each word). The tray has every recording of the
# line's words and of these. seconds isn't shown; when it's up, time-up shows.
first:
  seconds: 10
  line: this pages are my words and I
  words:
    noun: [pages, words]
    verb: [are, do]
    pronoun: [this, I, my, nothing]
    glue: [and]
  # the notice over the page when the time's up
  time-up:
    text: |
      it’s not good enough
      you need more training
    button: head to work

# between the first stage and the games
brief:
  - text: |
      you’re finally awake
      you’re a data labeller by day
      you train to speak the tangible, the real
      you check the rules
      1. rawdownload images
      2. solve puzzles
      3. unlock words
      4. express yourself
    button: rawdownload
  - text: you rawdownload the lot and start training
    button: begin

# the button on the last game's summary
work:
  last-button: finish work

# between the games and writing
debrief:
  - text: |
      You are a data labeller by day and a rapper by night
      You trained to speak the tangible, the real
      but you learned to turn it around and make it poetic
      tonight you can show it
    button: start writing

# Writing: the lines as the first stage left them, its words, what the games
# won, and these, every recording of each.
write:
  pauses: [0.25, 0.5, 1, 2, 4]   # beats: 1 = a quarter note, 4 = a bar
  yeahs: all                     # every yeah; or a list of them
  words:
    noun: [pages, words, book, hashtag, ideas, mask, prison, vaporwave]
    adjective: [shining]
    verb: [are, do, is, needed, stop, tell, that’s, was, welcome, what’s]
    pronoun: [it, its, them, this, what]
    glue: [a, an, and, also, at, but, by, down, for, if, just, no, not, of, on, out, that, the, to, with, there]
