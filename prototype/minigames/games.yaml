# Minigame content for prototype-06 to 09: which photos each game uses,
# what's found or matched in them, the words they reward, and the game
# settings; and for prototype-07 on, the tracks and what each game's score
# unlocks. pair-it is only played in prototype-08 and 09.
#
# - Photos are in build/images/. Name them as there (1.jpg, 2.png…).
# - Shapes for find and find-all are in build/images/<photo name>.svg (1.svg for
#   1.jpg), drawn at the photo's pixel size. A shape's id is the thing it marks:
#   "bread", or "fruits_1", "fruits_2"… for several of one thing. Case is ignored,
#   and anything after a _ is ignored. <polygon>, <path>, <rect>, <circle>,
#   <ellipse> and <g> (a group counts as one shape) all work.
# - rewards: the words a photo can win, grouped by bin as in tray.yaml. Words
#   match as in bins.yaml; a word listed under the wrong bin shows in its real
#   bin, with a warning next to the play button.
# - The thing to find always counts as one of the photo's words, listed or not.
# - prompt (optional): the text shown instead of "find: fruits". The thing's
#   name is shown in bold wherever it appears in the prompt.
# - rules: the card shown before the game. {seconds}, {rounds} and {pairs} are
#   filled in from the settings below. rules-07, if there is one, is the card
#   prototype-07 and 08 show instead, where every photo is played once each time
#   through. Prototype-09 shows no rules card: the games start straight away.
# - Problems (a missing .svg, a word not in the recording, a thing with no
#   shape) show next to the play button, and that photo or thing is left out.
# - Reload the page to see edits. They apply to games in progress. Words
#   already won stay won.
#
# Prototype-07 on:
# - Find It's share of a photo's other words depends on how quick the thing
#   is found: all of it in up to half the time, down to none a second before
#   the end.
# - unlocks: what a game's score unlocks beyond words. Each one is given when the
#   score is MORE than its `above` percentage of the game's points (find it:
#   one per thing found; pair it: one per pair matched; find them all: one
#   per shape found; caption match: one per round matched). An unlock can give:
#     track: a track name from `tracks` below. The player can choose any track
#            unlocked while writing.
#     text:  what the summary says about it. Leave it out to have one written.
#   Yeahs and pauses aren't unlocks: writing gives them all (story-07.yaml,
#   story-08.yaml).
#   Retrying a game throws away its unlocks and works them out again.
#   unlocks-09, where a game has it, is prototype-09's instead. Prototype-09
#   gives an unlock the moment the score passes it, and a track unlocked there
#   comes on straight away (the player can toggle it off at the top).
# - reach (find-all photos, optional): a click finds every shape within this
#   many of the photo's own pixels, instead of only the nearest one within
#   tolerance. For photos with many small shapes. One click can find several.
#   reach-09, where a photo has it, is prototype-09's instead: 09 shows the
#   whole photo, not zoomed in.

# the tracks. In prototype-07 and 08 the first one plays to begin with and is
# always there; in prototype-09 each one has to be unlocked.
tracks:
  metronome: audio/track-metronome.wav
  drums: audio/track-drums.wav
  full: audio/track-full.wav

# Find It: one photo and one thing per play. Finding it wins the thing's word
# and half of the photo's other words (not the other things to find). The
# photo's last thing to be found wins the rest. Each play picks a thing not
# found yet; once all are found, any thing.
find:
  title: find it
  rules: |
    click the thing named in the photo.
    {seconds} seconds.
    find it to win its word, and more words from the photo.
  seconds: 5
  tolerance: 10       # on-screen pixels of slack around each shape
  unlocks-09:         # prototype-09: one thing found
    - above: 0%
      track: metronome
  photos:
    1.jpg:
      find:
        long:
        bread:
      rewards:
        noun: [hot-dog, table, depth, bread]
        adjective: [long, deep, shining, stale]
    2.jpg:
      find:
        laying:
        floor:
      rewards:
        noun: [bathroom, floor, fear]
        verb: [laying, sleep]
    4.jpg:
      find:
        rich:
        lucozade:
      rewards:
        noun: [lucozade, bombay]
        adjective: [behind, together, rich]
    6.jpg:
      find:
        sits:
        feast:
      rewards:
        noun: [umbrella, chair, feast]
        verb: [sits]
        adjective: [hot]

# Pair It (prototype-08 and 09): every pair's photos in one grid, played once.
# Click two photos with the same energy to match them and win the pair's
# words. One point per pair matched. prompt is the line shown over the grid.
pair-it:
  title: pair it
  rules: |
    click two photos with the same energy.
    {pairs} pairs, {seconds} seconds.
    each pair you match wins its words.
  prompt: click two photos with the same energy
  seconds: 15
  # unlocks:
  #   - above: 50%
  #     track: drums
  unlocks-09:         # prototype-09: one pair matched
    - above: 0%
      track: drums
  pairs:
    - photos: [pair-it/A1.jpg, pair-it/A2.jpg]
      rewards:
        verb: [awaken]
    - photos: [pair-it/B1.jpg, pair-it/B2.jpg]
      rewards:
        adjective: [together]
    - photos: [pair-it/C1.jpg, pair-it/C2.jpg]
      rewards:
        noun: [angels]
    - photos: [pair-it/D1.jpg, pair-it/D2.jpg]
      rewards:
        adjective: [real]
    - photos: [pair-it/E1.jpg, pair-it/E2.jpg]
      rewards:
        verb: [say]
    - photos: [pair-it/F1.jpg, pair-it/F2.jpg]
      rewards:
        adjective: [unruly]

# Find Them All: one photo per play, zoomed in. The count found adds up over
# plays of the same photo. Words unlock as the count passes each step:
# with 10 to find and 5 words, one word per 2 found. The thing's own word comes
# first, then the others in the order listed. Each play picks a photo not
# finished yet; once all are finished, any photo, starting again from 0 (it
# can't win anything more).
find-all:
  title: find them all
  rules: |
    click every one of the things named.
    the photo is zoomed in: drag to look around.
    {seconds} seconds. what you find adds up each time you play this photo,
    and each step on the bar wins a word.
  rules-07: |
    click every one of the things named.
    the photos are zoomed in: drag to look around.
    {seconds} seconds a photo. each step on the bar wins a word.
  seconds: 15
  unlocks:
    - above: 50%
      track: drums
  unlocks-09:         # prototype-09: one shape found
    - above: 0%
      track: full
  zoom: 3             # the photo starts this many times the screen's width (not in prototype-09)
  tolerance: 10
  photos:
    3.jpg:
      find: fruits
      rewards:
        noun: [market, fruits, sale, growntology]
        adjective: [sustainable, renewable]
    5.jpg:
      find: white
      rewards:
        noun: [piece, geometries]
        adjective: [smooth, white, fine, minimal, blank]
    11.jpg:
      find: green
      rewards:
        noun: [banana-fish, woman, phone-box]
        adjective: [happy, green]
        verb: [connected]
    8.jpg:
      find: ecology
      rewards:
        noun: [blessings, cloth, vegetables, ecology]
        adjective: [much, alone]
    12.jpg:
      find: rain
      reach: 15         # prototype-07 and 08: a click finds every drop within 15 of the photo's pixels
      reach-09: 30      # prototype-09, which shows the whole photo
      rewards:
        noun: [barclays, bike-lane, P12, SL, rain, crack, person]
        adjective: [colourless]

# Caption Match: every round is played each time, in a random order. Pick the
# photo the caption describes from it and its decoys to win all its words.
caption-match:
  title: caption match
  rules: |
    click the photo the caption describes.
    {rounds} rounds, each quicker than the last.
    each one you match wins its words.
  seconds: [6, 4, 3]  # per round, in the order played; the last repeats if there are more rounds
  # prototype-09: the line over the photos; {caption} is the round's caption
  prompt: 'select the image that shows: "{caption}"'
  unlocks:
    - above: 50%
      track: full
  unlocks-09: []      # prototype-09: nothing
  rounds:
    - photo: 9.png
      caption: holding it furiously
      decoys: [15.png, 16.png]
      rewards:
        noun: [dog]
        verb: [holding]
        adjective: [furiously]
    - photo: 7.png
      caption: blowing paper
      decoys: [13.png, 14.png]
      rewards:
        verb: [made, hides]
        adjective: [poor, counterfeit]
    - photo: 10.png
      caption: Treasures from the Stone Age
      decoys: [17.jpg, 18.png]
      rewards:
        noun: [stone, time, treasure]
